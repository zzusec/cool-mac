<html lang="zh-CN"><head><meta charset="utf-8"><title>安装完成</title>
<style>body{font:14px -apple-system,sans-serif;color:#222;line-height:1.7;margin:24px}h1{font-size:22px}</style></head>
<body><h1>安装完成</h1>
<p>打开「清凉风扇」，点「设置 → 安全自检…」启用风扇控制。</p>
<p>应用在右上角菜单栏，可在设置里勾选「登录时启动」。</p>
<p>卸载：菜单「退出」后，把应用拖到废纸篓即可，后台会自行清除。</p>
</body></html>
